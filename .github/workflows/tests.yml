name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyTorch (CPU build) and the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,morphometry]"
      - name: Get the original MedSkel code (read-only, pinned commit)
        run: |
          git clone https://github.com/MouhssineElBoumshouli/medskel ../medskel
          git -C ../medskel checkout 1a838a8
      - name: Run the tests (synthetic data only, no FIVES needed)
        run: python -m pytest -q
