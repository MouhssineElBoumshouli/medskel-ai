<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" width="960" height="190" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>MedSkel AI pipeline: fundus photo, U-Net vessel mask, MedSkel centre lines, measurements</title>
  <rect width="960" height="190" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#13A89E"/></marker>
  </defs>
  <!-- 1 photo -->
  <g transform="translate(20,30)">
    <rect width="190" height="130" rx="10" fill="#EEF3F7"/>
    <circle cx="48" cy="65" r="34" fill="#C8662F"/><circle cx="64" cy="60" r="8" fill="#F2C14E"/>
    <path d="M64 60 C50 40, 35 38, 22 50 M64 60 C48 78, 34 86, 24 80 M64 60 C58 34, 50 30, 40 33" stroke="#7A1F12" stroke-width="2" fill="none"/>
    <text x="96" y="58" font-size="16" font-weight="700" fill="#0B2545">Photo</text>
    <text x="96" y="78" font-size="12" fill="#5C6B7A">fundus image</text>
    <text x="96" y="94" font-size="12" fill="#5C6B7A">2048 × 2048</text>
  </g>
  <line x1="214" y1="95" x2="242" y2="95" stroke="#13A89E" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- 2 U-Net -->
  <g transform="translate(250,30)">
    <rect width="190" height="130" rx="10" fill="#EEF3F7"/>
    <g fill="#0B2545"><rect x="16" y="28" width="5" height="44"/><rect x="24" y="40" width="7" height="32"/><rect x="34" y="52" width="9" height="20"/><rect x="46" y="62" width="11" height="12"/>
    <rect x="60" y="52" width="9" height="20"/><rect x="72" y="40" width="7" height="32"/><rect x="82" y="28" width="5" height="44"/></g>
    <rect x="46" y="62" width="11" height="12" fill="#13A89E"/>
    <path d="M21 34 H82 M31 46 H72 M43 58 H60" stroke="#B83A4B" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="98" y="58" font-size="16" font-weight="700" fill="#0B2545">U-Net</text>
    <text x="98" y="78" font-size="12" fill="#5C6B7A">vessel mask,</text>
    <text x="98" y="94" font-size="12" fill="#5C6B7A">pixel by pixel</text>
  </g>
  <line x1="444" y1="95" x2="472" y2="95" stroke="#13A89E" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- 3 MedSkel -->
  <g transform="translate(480,30)">
    <rect width="190" height="130" rx="10" fill="#EEF3F7"/>
    <path d="M14 68 C30 50, 50 44, 80 40" stroke="#BFE3E0" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M40 52 C46 66, 50 80, 54 96" stroke="#BFE3E0" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M14 68 C30 50, 50 44, 80 40 M40 52 C46 66, 50 80, 54 96" stroke="#B83A4B" stroke-width="2.2" fill="none"/>
    <circle cx="40" cy="52" r="3.5" fill="#0B2545"/>
    <text x="98" y="58" font-size="16" font-weight="700" fill="#0B2545">MedSkel</text>
    <text x="98" y="78" font-size="12" fill="#5C6B7A">centre lines</text>
    <text x="98" y="94" font-size="12" fill="#5C6B7A">(polygon + Voronoi)</text>
  </g>
  <line x1="674" y1="95" x2="702" y2="95" stroke="#13A89E" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- 4 measures -->
  <g transform="translate(710,30)">
    <rect width="230" height="130" rx="10" fill="#EEF3F7"/>
    <g fill="#13A89E"><rect x="18" y="56" width="12" height="40"/><rect x="34" y="66" width="12" height="30"/></g>
    <g fill="#C8553D"><rect x="50" y="70" width="12" height="26"/><rect x="66" y="72" width="12" height="24"/></g>
    <line x1="14" y1="96" x2="84" y2="96" stroke="#5C6B7A" stroke-width="1"/>
    <text x="98" y="50" font-size="16" font-weight="700" fill="#0B2545">Measurements</text>
    <text x="98" y="70" font-size="12" fill="#5C6B7A">density, fractal dim.,</text>
    <text x="98" y="86" font-size="12" fill="#5C6B7A">length, branch points,</text>
    <text x="98" y="102" font-size="12" fill="#5C6B7A">width (pixels)</text>
  </g>
</svg>
