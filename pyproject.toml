[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medskel-ai"
version = "0.1.0"
description = "A small, readable U-Net for retinal vessel segmentation on FIVES (university project)."
requires-python = ">=3.11"
# PyTorch is NOT listed here on purpose: install the CUDA build first (see README).
dependencies = ["numpy", "pillow", "matplotlib", "scipy", "scikit-image"]

[project.optional-dependencies]
dev = ["pytest"]
demo = ["gradio", "nbconvert", "ipykernel", "nbformat"]
# Only for the comparison model. Install the CUDA build of torchvision first (see README).
pretrained = ["segmentation-models-pytorch"]
# Measurement study (python -m medskel_ai.study). Also needs a clone of the original medskel repo next to this one.
morphometry = ["networkx", "opencv-python", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
